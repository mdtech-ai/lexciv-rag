[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lexciv"
version = "0.1.0"
description = "RAG assistant for Ivorian labour law and OHADA business law, with cited and evaluated answers."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Mamadou DIALLO" }]
license = { text = "MIT" }
# Runtime dependencies are added step by step as the project grows.
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
